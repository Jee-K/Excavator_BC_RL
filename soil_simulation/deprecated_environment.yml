name: newton-excavator
channels:
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy
  - pyyaml
  - pip

  - pip:
    # Newton (install from source in this repo)
    - -e .

    # NVIDIA Warp (GPU-accelerated compute)
    # Requires NVIDIA GPU with CUDA 12+
    - --extra-index-url https://pypi.nvidia.com/
    - warp-lang>=1.11.0

    # MuJoCo (from its own index)
    - --extra-index-url https://py.mujoco.org/
    - mujoco>=3.4.1.dev856273160

    # MuJoCo-Warp bridge (from source)
    - mujoco-warp>=0.0.2

    # Viewer / GUI
    - pyglet>=2.1.6
    - imgui_bundle>=1.92.0
    - cbor2>=5.7.0

    # URDF / mesh import
    - requests>=2.25.0
    - scipy
    - trimesh>=4.6.8
    - pycollada>=0.9
    - GitPython>=3.1.44

    # Mesh processing (optional but useful)
    - fast-simplification>=0.1.11
    - alphashape>=1.3.1
    - coacd>=1.0.7
    - meshio>=5.3.0
    - resolve-robotics-uri-py>=0.4.0
